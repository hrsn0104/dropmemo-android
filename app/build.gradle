plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dropmemo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dropmemo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
